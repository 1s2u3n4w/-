<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말씀 찾기 AI - 실시간 맞춤 묵상</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // 백엔드 프록시 서버 URL (Cloudflare Worker URL로 수정하세요)
        const PROXY_URL = "https://api.1s2u3n4w.workers.dev";

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Noto Serif KR', 'serif'],
                        batang: ['Gowun Batang', 'serif'],
                    },
                    colors: {
                        amberGold: { 100: '#fef3c7', 500: '#f59e0b', 800: '#92400e' }
                    }
                }
            }
        }
    </script>
    <style>
        .font-verse { font-family: 'Noto Serif KR', serif; }
        .font-batang { font-family: 'Gowun Batang', serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-100 selection:text-indigo-800">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('recommend')">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none tracking-tight">말씀 찾기 AI</h1>
                    <p class="text-[11px] text-indigo-300 tracking-wider font-medium">실시간 맞춤 묵상</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 sticky top-[61px] z-20 shadow-sm">
        <div class="max-w-3xl mx-auto flex px-4">
            <button id="tabBtnRecommend" onclick="switchTab('recommend')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 flex items-center justify-center gap-1.5 transition">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>말씀 찾기</span>
            </button>
            <button id="tabBtnHistory" onclick="switchTab('history')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 transition">
                <i data-lucide="history" class="w-4 h-4"></i>
                <span>내 말씀 보관함</span>
                <span id="historyBadge" class="hidden ml-1 px-1.5 py-0.5 text-[10px] bg-indigo-100 text-indigo-700 rounded-full font-bold">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-6">

        <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 max-w-sm pointer-events-none">
            <i id="toastIcon" data-lucide="info" class="w-5 h-5 text-indigo-400"></i>
            <span id="toastMessage" class="text-sm font-medium">메시지 내용</span>
        </div>

        <!-- TAB 1: RECOMMENDATION VIEW -->
        <section id="viewRecommend" class="space-y-6">
            <div class="glass-card rounded-2xl p-5 sm:p-7 shadow-sm border border-slate-200/80 space-y-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <span>오늘 당신의 마음과 상황을 들려주세요</span>
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">
                        Gemini AI가 당신의 이야기를 깊이 이해하고 **맞춤 성경 구절**을 추천해 드립니다.
                    </p>
                </div>

                <div>
                    <p class="text-xs text-slate-400 font-medium mb-1.5 flex items-center gap-1">
                        <i data-lucide="lightbulb" class="w-3.5 h-3.5 text-amber-500"></i>
                        <span>자주 쓰는 고민 예시:</span>
                    </p>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="setPromptInput('새로운 도전과 업무 부담감으로 불안하고 마음이 짓눌립니다.')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-slate-600 transition text-left">
                            💼 업무 부담과 불안
                        </button>
                        <button onclick="setPromptInput('소중한 사람과의 오해로 마음이 아프고 관계 회복에 지혜가 필요합니다.')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-slate-600 transition text-left">
                            💔 대인 관계와 오해
                        </button>
                        <button onclick="setPromptInput('지친 일상 속에서 진정한 마음의 평안과 안식을 얻고 싶습니다.')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-slate-600 transition text-left">
                            🌿 마음의 지침과 안식
                        </button>
                    </div>
                </div>

                <div class="relative">
                    <textarea id="situationInput" rows="4" 
                        placeholder="예: 결정을 앞두고 두려운 마음이 듭니다. 주님이 주시는 용기와 지혜의 말씀을 듣고 싶어요."
                        class="w-full p-4 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none resize-none text-slate-800 text-sm leading-relaxed transition shadow-inner"
                    ></textarea>
                </div>

                <div class="flex items-center justify-end">
                    <button id="submitBtn" onclick="requestRecommendation()" class="w-full sm:w-auto px-7 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2 transition transform active:scale-[0.98]">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        <span>AI 실시간 말씀 찾기</span>
                    </button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingCard" class="hidden glass-card rounded-2xl p-8 text-center space-y-4 border border-indigo-100">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 mb-1">
                    <i data-lucide="loader-2" class="w-7 h-7 animate-spin"></i>
                </div>
                <div>
                    <h3 class="text-base font-bold text-slate-800">AI가 말씀을 적어내려가고 있습니다</h3>
                    <p class="text-xs text-slate-500 mt-1">상황에 꼭 맞는 말씀을 찾는 중...</p>
                </div>
            </div>

            <!-- Result Card -->
            <div id="resultCard" class="hidden space-y-5">
                <div class="bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950 text-white rounded-2xl p-6 sm:p-8 shadow-xl relative overflow-hidden border border-slate-800 space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-white/10 pb-4">
                        <span id="resTag" class="px-3 py-1 rounded-full text-xs font-semibold bg-amberGold-500/20 text-amberGold-100 border border-amberGold-500/30 flex items-center gap-1">
                            <i data-lucide="tag" class="w-3 h-3"></i> #AI_맞춤찾기
                        </span>
                        <div class="flex items-center gap-2">
                            <button id="audioPlayBtn" onclick="toggleAudioReading()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition text-xs font-medium flex items-center gap-1.5 shadow">
                                <i id="audioIcon" data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                                <span id="audioBtnText">오디오 낭독</span>
                            </button>
                            <button onclick="copyVerseToClipboard()" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-slate-200 transition text-xs flex items-center gap-1">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                <span>복사</span>
                            </button>
                        </div>
                    </div>

                    <div>
                        <p class="text-xs text-indigo-300 uppercase tracking-widest font-semibold mb-1">오늘의 말씀 묵상</p>
                        <h3 id="resTitle" class="text-xl sm:text-2xl font-bold text-amber-200 font-batang leading-tight">묵상 제목</h3>
                    </div>

                    <div class="bg-white/5 rounded-xl p-5 border border-white/10 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-1.5">
                                <i data-lucide="book-open" class="w-3.5 h-3.5 text-amber-400"></i> 본문 말씀
                            </span>
                            <span id="resVerseRef" class="text-xs sm:text-sm font-semibold text-amber-300">— 성경 장절</span>
                        </div>
                        <blockquote class="text-base sm:text-lg font-serif leading-relaxed text-amber-50 border-l-2 border-amber-400 pl-3.5">
                            "<span id="resVerseText">성경 구절 본문</span>"
                        </blockquote>
                    </div>

                    <div class="space-y-3 pt-2">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-1.5">
                            <i data-lucide="feather" class="w-3.5 h-3.5 text-indigo-400"></i> 말씀 깊이 묵상하기
                        </h4>
                        <div id="resReflectionBody" class="text-sm sm:text-base text-slate-200 leading-relaxed space-y-3 font-light">
                            묵상 본문 내용
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 2: USER HISTORY -->
        <section id="viewHistory" class="hidden space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div>
                    <h2 class="text-base font-bold text-slate-900">내 말씀 보관함</h2>
                    <p class="text-xs text-slate-500">지나온 말씀과 묵상의 기록들입니다.</p>
                </div>
            </div>
            <div id="historyList" class="space-y-3"></div>
            <div id="emptyHistory" class="glass-card rounded-2xl p-12 text-center space-y-3">
                <h3 class="text-sm font-bold text-slate-700">저장된 묵상 기록이 없습니다</h3>
            </div>
        </section>
    </main>

    <script>
        let historyData = [];
        let currentRecommendation = null;
        let isAudioPlaying = false;
        let audioUtterance = null;

        window.onload = function() {
            lucide.createIcons();
            loadHistoryFromStorage();
            renderHistoryList();
        };

        function switchTab(tab) {
            const viewRecommend = document.getElementById('viewRecommend');
            const viewHistory = document.getElementById('viewHistory');
            const tabBtnRecommend = document.getElementById('tabBtnRecommend');
            const tabBtnHistory = document.getElementById('tabBtnHistory');

            const activeStyle = "flex-1 py-3 px-4 text-xs sm:text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 flex items-center justify-center gap-1.5 transition";
            const inactiveStyle = "flex-1 py-3 px-4 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 transition";

            if (tab === 'recommend') {
                viewRecommend.classList.remove('hidden');
                viewHistory.classList.add('hidden');
                tabBtnRecommend.className = activeStyle;
                tabBtnHistory.className = inactiveStyle;
            } else {
                viewRecommend.classList.add('hidden');
                viewHistory.classList.remove('hidden');
                tabBtnRecommend.className = inactiveStyle;
                tabBtnHistory.className = activeStyle;
                renderHistoryList();
            }
        }

        function setPromptInput(text) {
            const input = document.getElementById('situationInput');
            if (input) {
                input.value = text;
                input.focus();
            }
        }

        async function requestRecommendation() {
            const situationInput = document.getElementById('situationInput');
            const situation = situationInput ? situationInput.value.trim() : '';
            
            if (!situation) {
                showToast("오늘의 상황이나 고민을 작성해 주세요.", "warning");
                return;
            }

            const loadingCard = document.getElementById('loadingCard');
            const resultCard = document.getElementById('resultCard');
            const submitBtn = document.getElementById('submitBtn');

            loadingCard.classList.remove('hidden');
            resultCard.classList.add('hidden');
            if (submitBtn) submitBtn.disabled = true;

            try {
                // 프록시 서버로 요청 전달
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ situation: situation })
                });

                const resData = await response.json();
                if (!response.ok || resData.error) throw new Error(resData.error || "서버 응답 오류");

                const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
                const cleanJsonStr = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
                const data = JSON.parse(cleanJsonStr);

                currentRecommendation = data;

                document.getElementById('resTag').innerHTML = `<i data-lucide="tag" class="w-3 h-3"></i> ${data.theme_tag || '#AI_맞춤묵상'}`;
                document.getElementById('resTitle').innerText = data.title || '오늘의 묵상';
                document.getElementById('resVerseRef').innerText = `— ${data.verse_reference}`;
                document.getElementById('resVerseText').innerText = data.verse_text;

                const reflectionContainer = document.getElementById('resReflectionBody');
                const paragraphs = (data.reflection_body || '').split('\n').filter(p => p.trim() !== '');
                reflectionContainer.innerHTML = paragraphs.map(p => `<p class="leading-relaxed">${p}</p>`).join('');

                saveHistoryItem({
                    situation: situation,
                    verse_reference: data.verse_reference,
                    verse_text: data.verse_text,
                    theme_tag: data.theme_tag,
                    title: data.title,
                    reflection_body: data.reflection_body,
                    date: new Date().toISOString()
                });

                loadingCard.classList.add('hidden');
                resultCard.classList.remove('hidden');
                lucide.createIcons();
                resultCard.scrollIntoView({ behavior: 'smooth' });
                showToast("AI 맞춤 말씀을 찾았습니다!", "success");

            } catch (err) {
                console.error("오류 발생:", err);
                loadingCard.classList.add('hidden');
                showToast("말씀 찾는 중 오류가 발생했습니다.", "warning");
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        function toggleAudioReading() {
            if (!currentRecommendation) return;

            if (isAudioPlaying) {
                window.speechSynthesis.cancel();
                isAudioPlaying = false;
                updateAudioButtonUI(false);
                return;
            }

            const textToRead = `${currentRecommendation.title}. 본문 말씀. ${currentRecommendation.verse_reference}. ${currentRecommendation.verse_text}. 말씀 묵상. ${currentRecommendation.reflection_body}`;
            audioUtterance = new SpeechSynthesisUtterance(textToRead);
            audioUtterance.lang = 'ko-KR';

            audioUtterance.onend = () => updateAudioButtonUI(false);
            audioUtterance.onerror = () => updateAudioButtonUI(false);

            isAudioPlaying = true;
            updateAudioButtonUI(true);
            window.speechSynthesis.speak(audioUtterance);
        }

        function updateAudioButtonUI(playing) {
            const btnText = document.getElementById('audioBtnText');
            if (btnText) btnText.innerText = playing ? "낭독 정지" : "오디오 낭독";
        }

        function saveHistoryItem(item) {
            let currentHistory = JSON.parse(localStorage.getItem('bible_app_history') || '[]');
            currentHistory.unshift({ id: 'hist_' + Date.now(), ...item });
            localStorage.setItem('bible_app_history', JSON.stringify(currentHistory));
            historyData = currentHistory;
            updateHistoryBadge();
        }

        function loadHistoryFromStorage() {
            historyData = JSON.parse(localStorage.getItem('bible_app_history') || '[]');
            updateHistoryBadge();
        }

        function updateHistoryBadge() {
            const badge = document.getElementById('historyBadge');
            if (badge) {
                badge.innerText = historyData.length;
                badge.classList.toggle('hidden', historyData.length === 0);
            }
        }

        function renderHistoryList() {
            const listEl = document.getElementById('historyList');
            const emptyEl = document.getElementById('emptyHistory');

            if (historyData.length === 0) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.innerHTML = historyData.map(item => `
                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm space-y-1">
                    <span class="text-[10px] font-semibold text-indigo-600">${item.theme_tag || '#말씀'}</span>
                    <h4 class="text-sm font-bold text-slate-800">${item.title}</h4>
                    <p class="text-xs text-slate-500">${item.verse_reference} — "${item.verse_text}"</p>
                </div>
            `).join('');
        }

        function copyVerseToClipboard() {
            if (!currentRecommendation) return;
            const text = `[${currentRecommendation.title}]\n${currentRecommendation.verse_reference}\n"${currentRecommendation.verse_text}"\n\n${currentRecommendation.reflection_body}`;
            navigator.clipboard.writeText(text).then(() => showToast("복사되었습니다.", "success"));
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            if (!toast || !toastMsg) return;

            toastMsg.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
