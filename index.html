<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 성경 AI - 실시간 맞춤 묵상</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Noto Serif KR', 'serif'],
                        batang: ['Gowun Batang', 'serif'],
                    },
                    colors: {
                        amberGold: {
                            100: '#fef3c7',
                            500: '#f59e0b',
                            800: '#92400e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-verse { font-family: 'Noto Serif KR', serif; }
        .font-batang { font-family: 'Gowun Batang', serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-100 selection:text-indigo-800">

    <!-- Navigation / Header -->
    <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('recommend')">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none tracking-tight">마음성경 AI</h1>
                    <p class="text-[11px] text-indigo-300 tracking-wider font-medium">실시간 맞춤 묵상</p>
                </div>
            </div>
            <!-- API Key Settings Button -->
            <button onclick="openApiKeyModal()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 flex items-center gap-1.5 transition">
                <i data-lucide="key" class="w-3.5 h-3.5"></i>
                <span id="apiKeyBtnText">API 키 설정</span>
                <span id="apiKeyStatusDot" class="w-2 h-2 rounded-full bg-rose-500"></span>
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 sticky top-[61px] z-20 shadow-sm">
        <div class="max-w-3xl mx-auto flex px-4">
            <button id="tabBtnRecommend" onclick="switchTab('recommend')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 flex items-center justify-center gap-1.5 transition">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>AI 묵상 생성</span>
            </button>
            <button id="tabBtnHistory" onclick="switchTab('history')" class="flex-1 py-3 px-4 text-xs sm:text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 transition">
                <i data-lucide="history" class="w-4 h-4"></i>
                <span>내 묵상 보관함</span>
                <span id="historyBadge" class="hidden ml-1 px-1.5 py-0.5 text-[10px] bg-indigo-100 text-indigo-700 rounded-full font-bold">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Toast Notification Box -->
        <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 max-w-sm pointer-events-none">
            <i id="toastIcon" data-lucide="info" class="w-5 h-5 text-indigo-400"></i>
            <span id="toastMessage" class="text-sm font-medium">메시지 내용</span>
        </div>

        <!-- ================= TAB 1: RECOMMENDATION VIEW ================= -->
        <section id="viewRecommend" class="space-y-6">
            
            <!-- API Key Missing Alert Banner -->
            <div id="apiKeyBanner" class="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center justify-between gap-3 text-amber-900 text-xs sm:text-sm">
                <div class="flex items-center gap-2.5">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 shrink-0"></i>
                    <span>AI 묵상을 생성하려면 <strong>Gemini API 키</strong> 설정이 필요합니다.</span>
                </div>
                <button onclick="openApiKeyModal()" class="px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-semibold transition shrink-0">
                    지금 키 입력
                </button>
            </div>

            <!-- Input Card -->
            <div class="glass-card rounded-2xl p-5 sm:p-7 shadow-sm border border-slate-200/80 space-y-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <span>오늘 당신의 상황과 마음 고백을 작성하세요</span>
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">
                        Gemini AI가 당신의 이야기를 깊이 파악하여 **맞춤 성경 구절과 깊은 묵상 본문**을 선사합니다.
                    </p>
                </div>

                <!-- Scenario Prompt Chips -->
                <div>
                    <p class="text-xs text-slate-400 font-medium mb-1.5 flex items-center gap-1">
                        <i data-lucide="lightbulb" class="w-3.5 h-3.5 text-amber-500"></i>
                        <span>클릭하여 질문 예시 적용:</span>
                    </p>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="setPromptInput('새로운 환경과 업무 적응 문제로 불안하고 내 한계를 느낍니다.')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-slate-600 transition text-left">
                            💼 업무 부담과 불안
                        </button>
                        <button onclick="setPromptInput('소중한 사람과의 오해로 마음이 무겁고 어찌해야 할지 모르겠습니다.')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-slate-600 transition text-left">
                            💔 대인 관계의 오해와 아픔
                        </button>
                        <button onclick="setPromptInput('반복되는 삶 속에 마음이 지쳐있습니다. 진정한 평안과 안식이 필요해요.')" class="text-xs px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-slate-600 transition text-left">
                            🌿 마음의 지침과 안식
                        </button>
                    </div>
                </div>

                <!-- Textarea -->
                <div class="relative">
                    <textarea id="situationInput" rows="4" 
                        placeholder="예: 중요한 결정을 앞두고 주저하고 있습니다. 저에게 지혜와 용기를 주는 말씀을 내려주세요."
                        class="w-full p-4 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none resize-none text-slate-800 text-sm leading-relaxed transition shadow-inner"
                    ></textarea>
                </div>

                <!-- Action Button -->
                <div class="flex items-center justify-end">
                    <button id="submitBtn" onclick="requestRecommendation()" class="w-full sm:w-auto px-7 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2 transition transform active:
